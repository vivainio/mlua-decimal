[project]
site_name = "mlua-decimal"
site_description = "An exact base-10 Decimal for mlua: a userdata and the global D, for Luau and Lua."
site_author = "Ville Vainio"
site_url = "https://vivainio.github.io/mlua-decimal/"
docs_dir = "docs"
repo_url = "https://github.com/vivainio/mlua-decimal"
repo_name = "vivainio/mlua-decimal"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Using it from Rust" = "rust.md" },
  { "Decimals in Lua" = "lua.md" },
  { "Type checking" = "type-checking.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vivainio/mlua-decimal"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
